<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM Test Runner</title><style>body{font-family:system-ui;margin:0;background:#0d1117;color:#e6edf3}main{max-width:1100px;margin:auto;padding:24px}button{padding:10px 16px;margin:4px;border:0;border-radius:8px;cursor:pointer}pre{background:#010409;border:1px solid #30363d;border-radius:10px;padding:16px;min-height:420px;white-space:pre-wrap;overflow:auto}.ok{color:#3fb950}.bad{color:#f85149}.bar{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main><h1>RTK CRM — тесты</h1><div class="bar"><button onclick="run('all')">Все</button><button onclick="run('unit')">Unit</button><button onclick="run('api')">API</button><button onclick="run('integration')">Integration</button></div><p id="status">Готово</p><pre id="log"></pre></main><script>
let timer; async function run(scope){clearInterval(timer);document.querySelector('#log').textContent='';document.querySelector('#status').textContent='Запуск...';const r=await fetch('/api/v1/tests/run?scope='+scope,{method:'POST'});const j=await r.json();poll(j.id)}
async function poll(id){const f=async()=>{const r=await fetch('/api/v1/tests/runs/'+id);const j=await r.json();document.querySelector('#log').textContent=j.output||'';document.querySelector('#status').textContent=j.status+(j.exit_code===null?'':' | exit '+j.exit_code);if(j.status==='queued'||j.status==='running')timer=setTimeout(f,500);else document.querySelector('#status').className=j.status==='passed'?'ok':'bad'};f()}
</script></body></html>
